name: Main Workflow (Node.js CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"   # Runs every Sunday at midnight UTC
    - cron : "0 12 * * 3"  # Runs every Wednesday at noon UTC

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
        working-directory: ./server

      - run: npm test
        env:
          CI: true
        working-directory: ./server
      - name: Lint Code Base
        run: npm run lint